<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Kehadiran - Yayasan Taman Pendidikan Rahmat</title>
  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }
    h2 { color: #1e3a8a; margin-top: 0; font-size: 20px; }
    h4 { color: #4b5563; margin-top: -10px; margin-bottom: 20px; font-weight: normal; font-size: 14px; }
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px dashed #cbd5e1;
    }
    #result-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 8px;
      display: none;
    }
    .status-loading { background: #fef3c7; border: 1px solid #fde047; color: #b45309; }
    .status-success { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; }
    .status-warning { background: #ffedd5; border: 1px solid #fdba74; color: #c2410c; }
    .status-error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
    
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div class="card">
  <h2>YAYASAN TAMAN PENDIDIKAN RAHMAT</h2>
  <h4>Pemindai Presensi Seminar</h4>
  
  <div id="reader"></div>

  <div id="result-box" class="status-loading">
    <div id="status-content">Sedang memproses & memverifikasi data...</div>
    <button class="btn" id="btnRestart" style="display: none;" onclick="restartScanner()">Pindai QR Berikutnya</button>
  </div>
</div>

<script>
  // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
  const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwUJ2dCb1b909Rb7DQa8rsw3LFuUvSTKiLbrMUsrhcaqlqFxZktPrzcLa3sArUo6o7h/exec";

  let html5QrcodeScanner;

  function onScanSuccess(decodedText, decodedResult) {
    // Hentikan sementara kamera setelah QR terbaca
    if (html5QrcodeScanner) {
      html5QrcodeScanner.clear();
    }

    document.getElementById('reader').style.display = 'none';
    const resultBox = document.getElementById('result-box');
    const statusContent = document.getElementById('status-content');
    const btnRestart = document.getElementById('btnRestart');

    resultBox.className = "status-loading";
    resultBox.style.display = "block";
    btnRestart.style.display = "none";
    statusContent.innerHTML = "⏳ Memproses verifikasi ID: <b>" + decodedText + "</b>...";

    // Kirim ID Registrasi ke Google Sheets
    fetch(GOOGLE_WEB_APP_URL, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ idReg: decodedText })
    })
    .then(response => response.json())
    .then(data => {
      btnRestart.style.display = "block";

      if (data.success) {
        resultBox.className = "status-success";
        statusContent.innerHTML = `
          <h3 style="margin:0 0 10px 0;">✅ ${data.message}</h3>
          <p style="margin:5px 0;"><strong>Nama Siswa:</strong> ${data.nama}</p>
          <p style="margin:5px 0; font-size:13px; opacity:0.8;">ID: ${decodedText}</p>
        `;
      } else if (data.alreadyScanned) {
        resultBox.className = "status-warning";
        statusContent.innerHTML = `
          <h3 style="margin:0 0 10px 0;">⚠️ Peringatan</h3>
          <p style="margin:5px 0;">${data.message}</p>
          <p style="margin:5px 0;"><strong>Nama Siswa:</strong> ${data.nama}</p>
          <p style="margin:5px 0; font-size:13px; opacity:0.8;">ID: ${decodedText}</p>
        `;
      } else {
        resultBox.className = "status-error";
        statusContent.innerHTML = `
          <h3 style="margin:0 0 10px 0;">❌ Gagal Validasi</h3>
          <p style="margin:5px 0;">${data.message}</p>
          <p style="margin:5px 0; font-size:13px; opacity:0.8;">ID: ${decodedText}</p>
        `;
      }
    })
    .catch(error => {
      btnRestart.style.display = "block";
      resultBox.className = "status-error";
      statusContent.innerHTML = `
        <h3 style="margin:0 0 10px 0;">❌ Koneksi Terputus</h3>
        <p style="margin:5px 0;">Gagal terhubung ke database Google Sheets.</p>
        <small>${error.message}</small>
      `;
    });
  }

  function initScanner() {
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('reader').style.display = 'block';

    html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { 
        fps: 10, 
        qrbox: { width: 220, height: 220 } 
      },
      false
    );
    html5QrcodeScanner.render(onScanSuccess, function(err){});
  }

  function restartScanner() {
    initScanner();
  }

  window.onload = initScanner;
</script>

</body>
</html>
